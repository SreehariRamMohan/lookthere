# ImageNet-1k at 90% sparsity (the paper's run).
# Phase 2 trains the selector with GRPO and the extractor with cross-entropy.
# The paper's run started from a warmup checkpoint of 125000 steps. It was initialized from LookWhere
# DINOv2 weights and trained on 8 GPUs with batch size 64 each.
# Download the `init` checkpoint from https://huggingface.co/SreehariRamMohan/lookthere first:
#   hf download SreehariRamMohan/lookthere imagenet/warmup/model.pt --local-dir lookthere_ckpts
dataset: imagenet
data_root: ./imagenet
output_dir: runs/rl_imagenet_90
init: lookthere_ckpts/imagenet/warmup/model.pt
img_size: 518
batch_size: 32
num_workers: 8

# Hierarchical policy. Each stage adds one decision grid.
# There are 100000 RL steps in total.
grid_stages: [6, 18, 37]
steps_per_stage: [0, 0, 100000]
beta_init: 0.25
beta_max: 5.0
temperature: [1.0, 0.3]         # Linear decay during RL.
logit_offset: 3.0               # Added to every keep logit, so RL starts by keeping most patches (the paper's run).
entropy_coeff: [0.5, 0.35, 0.2]  # Entropy bonus at the start, middle and end of RL.

# GRPO
num_samples: 8
advantage_clip: 5.0
min_group_std: 0.01

# The reward is -CE + lam * 1[correct] * sparsity_reward(mask). See train.sparsity_reward.
lam: 0.2
sparsity_target: 0.1

# The cosine learning rate schedule continues the step count of the warmup (see train.run_rl).
selector_lr: 2.0e-5
extractor_lr: 5.0e-5
min_lr: null
weight_decay: 0.02

log_every: 100
save_every: 5000
